name: Bug Report
description: Report a bug or unexpected behavior in Interceptly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue! Please provide as much detail as possible to help us diagnose and resolve the problem quickly.

  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      description: Which package is experiencing the problem?
      options:
        - interceptly (Core & UI)
        - interceptly_dio
        - interceptly_http
        - interceptly_chopper
        - interceptly_web_socket
        - example app
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or minimal code snippet to reproduce the issue.
      placeholder: |
        1. Initialize Interceptly with ...
        2. Perform request via ...
        3. Open inspector overlay ...
        4. Observe error ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Output of `flutter doctor -v` or relevant Flutter and Dart SDK versions.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Stacktrace
      description: Paste any error messages, logs, or stacktraces if available.
      render: shell
