name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview versions/changelog without publishing or pushing tags)'
        required: true
        type: boolean
        default: true
      prerelease:
        description: 'Publish as pre-release'
        required: false
        type: boolean
        default: false
      manual_version:
        description: 'Manual version override (e.g. interceptly:2.1.1, interceptly:patch, or leave empty for auto)'
        required: false
        type: string
        default: ''
  push:
    tags:
      - '*-v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Melos Release & Pub.dev Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for Pub.dev OIDC authentication
      contents: write # Required for pushing git tags and creating releases
      pull-requests: read

    steps:
      - name: Checkout repository (full history for SemVer tagging)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap Melos workspace
        run: melos bootstrap

      - name: Pre-release Quality Gate
        run: melos run check

      # --- 1. Versioning Step (manual dispatch only) ---
      - name: Preview Versioning (Dry Run)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: |
          echo "::notice::Running Melos versioning in DRY RUN mode..."
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --prerelease"
          fi
          if [ -n "${{ github.event.inputs.manual_version }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --manual-version=${{ github.event.inputs.manual_version }}"
          fi
          melos version --yes --no-git-tag-version $EXTRA_ARGS
          echo "=== CHANGELOG DIFF PREVIEW ==="
          git diff

      - name: Apply Versioning & Push Tags
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true' }}
        run: |
          echo "::notice::Applying Melos versioning and pushing release tags..."
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --prerelease"
          fi
          if [ -n "${{ github.event.inputs.manual_version }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --manual-version=${{ github.event.inputs.manual_version }}"
          fi
          melos version --yes $EXTRA_ARGS
          git push --follow-tags origin main

      # --- 2. Pub.dev Publishing via OIDC ---
      - name: Publish Packages to Pub.dev (Dry Run)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: |
          echo "::notice::Running Melos publish in DRY RUN mode..."
          melos publish --yes --dry-run

      - name: Publish Packages to Pub.dev via OIDC
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true') }}
        env:
          PUB_HOSTED_URL: https://pub.dev
        run: |
          echo "::notice::Publishing packages to pub.dev with OIDC token..."
          melos publish --yes --no-dry-run

      # --- 3. GitHub Releases Creation ---
      - name: Create GitHub Releases
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            echo "Creating GitHub Release for tag: $TAG..."
            gh release create "$TAG" --title "$TAG" --generate-notes || true
          else
            for tag in $(git tag --points-at HEAD); do
              echo "Creating GitHub Release for $tag..."
              gh release create "$tag" \
                --title "$tag" \
                --generate-notes \
                ${{ github.event.inputs.prerelease == 'true' && '--prerelease' || '' }} || true
            done
          fi
