name: Release & Versioning

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview versions/changelog without committing or pushing tags)'
        required: true
        type: boolean
        default: true
      prerelease:
        description: 'Publish as pre-release'
        required: false
        type: boolean
        default: false
      manual_version:
        description: 'Manual version override (e.g. interceptly:2.2.0, or leave empty for auto)'
        required: false
        type: string
        default: ''

concurrency:
  group: release-versioning
  cancel-in-progress: false

jobs:
  version:
    name: Melos Versioning & Tagging
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for pushing git commits and tags

    steps:
      - name: Checkout repository (full history for SemVer tagging)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Melos
        run: dart pub global activate melos 8.10.0

      - name: Bootstrap Melos workspace
        run: melos bootstrap

      - name: Pre-release Quality Gate
        run: melos run check

      # --- Dry Run Versioning ---
      - name: Preview Versioning (Dry Run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "::notice::Running Melos versioning in DRY RUN mode..."
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --prerelease"
          fi
          if [ -n "${{ github.event.inputs.manual_version }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --manual-version=${{ github.event.inputs.manual_version }}"
          fi
          echo "N" | melos version --yes --no-git-tag-version --no-git-commit-version $EXTRA_ARGS
          echo "=== CHANGELOG & PUBSPEC DIFF PREVIEW ==="
          git diff

      # --- Apply Versioning & Push Tags ---
      - name: Apply Versioning & Push Tags
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          echo "::notice::Applying Melos versioning and pushing release tags..."
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --prerelease"
          fi
          if [ -n "${{ github.event.inputs.manual_version }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --manual-version=${{ github.event.inputs.manual_version }}"
          fi
          echo "N" | melos version --yes $EXTRA_ARGS
          if [ -n "$RELEASE_PAT" ]; then
            git remote set-url origin https://x-access-token:${RELEASE_PAT}@github.com/${{ github.repository }}.git
          fi
          git push --follow-tags origin main
          echo "::notice::Release tags pushed successfully. Publish workflow will now trigger per-package on tag push."
